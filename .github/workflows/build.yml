name: Build
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]

jobs:
  build:
    strategy:
      matrix:
        include:
          - { os: windows-latest, arch: x64, args: "-A x64" }
          - { os: windows-latest, arch: x86, args: "-A Win32" }
          - { os: windows-latest, arch: ARM64, args: "-A ARM64" }
          - { os: ubuntu-latest, arch: x64, args: "" }
          - { os: macos-latest, arch: x64, args: "" }
    runs-on: ${{ matrix.os }}
    name: ${{ matrix.os }} (${{ matrix.arch }})
    steps:
      - uses: actions/checkout@v4
      - run: cmake -B build -DCMAKE_BUILD_TYPE=Release ${{ matrix.args }}
      - run: cmake --build build --config Release
      - uses: actions/upload-artifact@v4
        if: startsWith(github.ref, 'refs/tags/')
        with:
          name: puttyalt-${{ matrix.os }}-${{ matrix.arch }}
          path: build/

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check include guards
        run: for f in puttyalt_*.h; do grep -q "#ifndef" "$f" || exit 1; done
      - name: Version match
        run: |
          VER=$(grep PUTTYALT_VERSION_STR puttyalt.h | grep -o '"[^"]*"' | tr -d '"')
          grep -q "\[$VER\]" CHANGELOG.md
      - name: Module count
        run: echo "$(ls puttyalt_*.c | wc -l) modules"

  release:
    needs: [build, lint]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
      - uses: softprops/action-gh-release@v1
        with: { generate_release_notes: true }
