name: Build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]

jobs:
  build-linux:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Configure
      run: mkdir build && cd build && cmake .. -DCMAKE_C_FLAGS="-Wall -Wextra"
    - name: Build
      run: cd build && make -j$(nproc)
    - name: Verify
      run: ./build/puttyalt --version
    - uses: actions/upload-artifact@v4
      with:
        name: puttyalt-linux-x86_64
        path: build/puttyalt

  build-windows:
    runs-on: windows-latest
    steps:
    - uses: actions/checkout@v4
    - name: Configure
      run: mkdir build && cd build && cmake .. -G "Visual Studio 17 2022" -A x64
    - name: Build
      run: cmake --build build --config Release
    - uses: actions/upload-artifact@v4
      with:
        name: puttyalt-windows-x64
        path: build/Release/puttyalt.exe

  build-macos:
    runs-on: macos-latest
    steps:
    - uses: actions/checkout@v4
    - name: Configure
      run: mkdir build && cd build && cmake .. -DCMAKE_C_FLAGS="-Wall"
    - name: Build
      run: cd build && make -j$(sysctl -n hw.ncpu)
    - uses: actions/upload-artifact@v4
      with:
        name: puttyalt-macos
        path: build/puttyalt

  release:
    needs: [build-linux, build-windows, build-macos]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
    - uses: actions/download-artifact@v4
    - name: Create Release
      uses: softprops/action-gh-release@v2
      with:
        files: |
          puttyalt-windows-x64/puttyalt.exe
          puttyalt-linux-x86_64/puttyalt
          puttyalt-macos/puttyalt
