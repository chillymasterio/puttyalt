name: Bug Report
description: Report a bug in PuttyAlt
title: "[Bug] "
labels: ["bug", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting a bug! Please fill out the information below.

  - type: input
    id: version
    attributes:
      label: PuttyAlt Version
      placeholder: e.g. 0.1.0
    validations:
      required: true

  - type: dropdown
    id: os
    attributes:
      label: Operating System
      options:
        - Windows 11
        - Windows 10
        - Windows Server 2025
        - Windows Server 2022
        - Windows Server 2019
        - Other (specify below)
    validations:
      required: true

  - type: textarea
    id: description
    attributes:
      label: Bug Description
      description: What happened? What did you expect to happen?
      placeholder: |
        When I try to connect to a server via SSH...
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to Reproduce
      description: Minimal steps to reproduce the issue.
      placeholder: |
        1. Open PuttyAlt
        2. Enter hostname...
        3. Click Connect
        4. See error
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Event Log / Error Output
      description: Paste any relevant logs (Help > Event Log).
      render: text

  - type: textarea
    id: extra
    attributes:
      label: Additional Context
      description: Screenshots, server type, connection details, etc.
