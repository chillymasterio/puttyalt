<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" fill="none">
  <rect width="128" height="128" rx="28" fill="#111827"/>
  <rect x="2" y="2" width="124" height="124" rx="26" stroke="#3b82f6" stroke-width="2" stroke-opacity="0.3"/>
  <!-- Terminal window -->
  <rect x="24" y="32" width="80" height="64" rx="6" fill="#1a2332" stroke="#2a3a4e" stroke-width="1.5"/>
  <!-- Title bar -->
  <rect x="24" y="32" width="80" height="14" rx="6" fill="#1e293b"/>
  <rect x="24" y="40" width="80" height="6" fill="#1e293b"/>
  <!-- Window buttons -->
  <circle cx="34" cy="39" r="2.5" fill="#ef4444"/>
  <circle cx="42" cy="39" r="2.5" fill="#f59e0b"/>
  <circle cx="50" cy="39" r="2.5" fill="#22c55e"/>
  <!-- Terminal content -->
  <text x="30" y="60" font-family="monospace" font-size="9" fill="#3b82f6">$</text>
  <text x="38" y="60" font-family="monospace" font-size="9" fill="#94a3b8">ssh server</text>
  <text x="30" y="72" font-family="monospace" font-size="9" fill="#22c55e">Connected</text>
  <text x="30" y="84" font-family="monospace" font-size="9" fill="#3b82f6">$</text>
  <rect x="38" y="78" width="6" height="9" fill="#3b82f6" opacity="0.8">
    <animate attributeName="opacity" values="0.8;0.2;0.8" dur="1.2s" repeatCount="indefinite"/>
  </rect>
  <!-- Tabs indicator -->
  <rect x="56" y="22" width="24" height="10" rx="3" fill="#3b82f6" opacity="0.2"/>
  <rect x="56" y="22" width="24" height="10" rx="3" stroke="#3b82f6" stroke-width="1"/>
  <rect x="30" y="22" width="22" height="10" rx="3" fill="#1e293b" stroke="#2a3a4e" stroke-width="0.5"/>
  <rect x="84" y="22" width="22" height="10" rx="3" fill="#1e293b" stroke="#2a3a4e" stroke-width="0.5"/>
</svg>
